name: update app + deploy

on:
  schedule:
    - cron: '17 4 * * *' # daily, off the hour
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest published app
        run: python3 tools/update-app.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet site/app site/manifest.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new app version
        if: steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Nemo"
          git config user.email "328747105+Nemo-010@users.noreply.github.com"
          git add site/app site/manifest.json
          git commit -m "app: update to $(python3 -c "import json;print(json.load(open('site/manifest.json'))['version'])")"
          git push

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
